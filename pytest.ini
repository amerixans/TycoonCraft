[pytest]
testpaths = tests

# Put the repo root on sys.path so `from game import ...` resolves.
#
# Without this, `python -m pytest` works (it adds the CWD itself) and bare
# `pytest` does not -- so the whole suite passed locally and every test errored
# on collection in CI. Setting it here means both invocations behave the same,
# which is the point.
pythonpath = .

markers =
    live: needs a running server at $BASE_URL; skipped in the unit run
filterwarnings =
    error::DeprecationWarning:game.*
    error::DeprecationWarning:app
