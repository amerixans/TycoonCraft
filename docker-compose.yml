# TycoonCraft -- one container on the shared collabcanvas droplet.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#
# On the droplet, add-app.sh writes BASE_PATH and HOST_PORT into .env and
# generates the matching nginx location block. Do not pick a port by hand.

services:
  app:
    build: .
    image: tycooncraft:latest
    restart: unless-stopped
    environment:
      # Subpath this is mounted at, e.g. /tycooncraft. Empty means domain root.
      BASE_PATH: ${BASE_PATH:-}
      PORT: 8080
      DATA_DIR: /app/data
      # Absent is a supported state: items fall back to deterministic names
      # and /health reports {"llm": "unconfigured"}.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
    ports:
      # Loopback only: nginx reaches it, the internet does not.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      # The SQLite file and the generated secret. In the image would mean
      # every player losing their save on redeploy.
      - tycooncraft-data:/app/data
    healthcheck:
      # busybox wget, not `python -c urllib`: starting Python and importing
      # urllib can take longer than the timeout on the swapping droplet, which
      # marks a healthy container "unhealthy" (seen on whiteboard-collab).
      # /health without the prefix: the app strips BASE_PATH when present and
      # answers bare paths either way (nginx sends them stripped).
      test: ["CMD", "busybox", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      # One chatty app fills a 24 GB disk shared with every other app.
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  tycooncraft-data:
